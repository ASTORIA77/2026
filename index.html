<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F8FF">
<title>2026 · 回望来路 启航新程</title>
<link rel="preload" href="video/lanbao.webp" as="image">
<style>
/* ===== 开源字体：Noto Sans SC（思源黑体）+ Outfit，均为 SIL OFL 1.1 ===== */
@font-face{font-family:"NSans";font-weight:400;font-display:swap;src:url(fonts/noto-sans-sc-chinese-simplified-400-normal.woff2) format("woff2")}
@font-face{font-family:"NSans";font-weight:700;font-display:swap;src:url(fonts/noto-sans-sc-chinese-simplified-700-normal.woff2) format("woff2")}
@font-face{font-family:"Outfit";font-weight:300;font-display:swap;src:url(fonts/outfit-latin-300-normal.woff2) format("woff2")}
@font-face{font-family:"Outfit";font-weight:500;font-display:swap;src:url(fonts/outfit-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Outfit";font-weight:700;font-display:swap;src:url(fonts/outfit-latin-700-normal.woff2) format("woff2")}

:root{
  --bg:#F5F8FF; --white:#FFFFFF;
  --ink:#0F1B33; --ink2:#4B5A75; --ink3:#8E9AB2;
  --blue:#2B6BFF; --blue2:#1847C9; --blue-l:#E6EEFF; --blue-ll:#F0F5FF; --blue-soft:#6B95F2;
  --amber:#FFA826; --coral:#FF6B5B;
  --line:#E2E9F6;
  --sans:"NSans","Noto Sans SC","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  --num:"Outfit","NSans",sans-serif;
  --pad:20px; --cw:46px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{background:var(--bg)}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.7;font-size:19px;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:radial-gradient(120% 60% at 50% -10%,#DDE8FF 0,rgba(221,232,255,0) 60%),var(--bg) no-repeat}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--pad)}

/* ================= 刊头 ================= */
.hero{padding-top:calc(22px + env(safe-area-inset-top))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pill{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 14px;border-radius:99px;background:var(--white);border:1px solid var(--line);
  font-size:13px;color:var(--ink2);letter-spacing:.06em;box-shadow:1px 1px 2px rgba(0,0,0,0.12),2px 2px 5px rgba(0,0,0,0.08),inset 0 1px 2px rgba(255,255,255,0.6)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--coral)}
.music{display:none;align-items:center;gap:6px;height:32px;padding:0 12px 0 5px;border-radius:99px;background:#fff;border:1px solid rgba(213,223,240,0.6);font-size:12px;font-weight:600;color:#8B9DC3;max-width:58%;box-shadow:0 4px 12px rgba(43,107,255,0.08),0 2px 4px rgba(0,0,0,0.04),inset 0 1px 2px rgba(255,255,255,0.8);transition:all .3s ease}
.music:hover{box-shadow:0 6px 16px rgba(43,107,255,0.12),0 3px 6px rgba(0,0,0,0.06),inset 0 1px 2px rgba(255,255,255,0.8);transform:translateY(-1px);color:#5A7BA8}
.music.ok{display:inline-flex}
.music .disc{flex:none;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,var(--white) 0 3px,var(--blue) 3.5px 6px,#1B2C55 6.5px);
  animation:spin 3.2s linear infinite;animation-play-state:paused}
.music.on .disc{animation-play-state:running}
.music .mt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.music .eq{display:flex;align-items:flex-end;gap:2px;height:12px;flex:none}
.music .eq i{width:2px;height:4px;border-radius:1px;background:var(--blue)}
.music.on .eq i{animation:eq .9s ease-in-out infinite}
.music.on .eq i:nth-child(2){animation-delay:.2s}.music.on .eq i:nth-child(3){animation-delay:.4s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

.hero-main{--yr:clamp(58px,17vw,104px);display:flex;align-items:flex-end;justify-content:space-between;margin-top:20px}
.yr{font-family:var(--num);font-weight:700;font-size:var(--yr);line-height:.72;letter-spacing:-.03em;color:var(--ink);text-shadow:2px -2px 2px rgba(0,0,0,0.25),-2px -2px 2px rgba(255,255,255,0.7)}
.yr em{font-style:normal;color:var(--blue)}
.hero-t{text-align:right;display:flex;flex-direction:column;justify-content:space-between;transform:translateY(6px)}
.hero-t b{display:block;font-size:calc(var(--yr) * .30);letter-spacing:.12em;margin-right:-.12em;line-height:1.6;white-space:nowrap;text-shadow:0.75px -0.75px 0.75px rgba(0,0,0,0.25),-0.75px -0.75px 0.75px rgba(255,255,255,0.7)}
.hero-t b:first-child{transform:translateY(1px)}
.hero-t span{font-size:13px;color:var(--ink3);letter-spacing:.1em}
.lede{margin-top:10px;margin-bottom:10px;font-size:16px;color:var(--ink2)}
.lede b{color:var(--blue);font-weight:700}

/* ================= 主体 ================= */
.main{display:flex;flex-direction:column}
.col-l{padding-top:8px}

/* ---------- 年轮：手机上铺满可用宽度，两侧留白 ---------- */
.dial-box{position:relative;width:90%;max-width:min(85vw,48dvh);aspect-ratio:1;margin:0 auto;container-type:inline-size}
#dial{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;overflow:visible}
#dial:active{cursor:grabbing}
.dial-c{position:absolute;left:50%;top:50%;width:48%;height:48%;padding-top:3%;transform:translate(-50%,-50%);border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;touch-action:pan-y}
.c-m{font-size:17px;font-size:5cqw;font-weight:700;letter-spacing:.12em;color:var(--blue)}
.c-d{font-family:var(--num);font-weight:500;font-size:60px;font-size:17cqw;line-height:1;color:var(--ink);letter-spacing:-.02em}
.c-w{margin-top:2px;font-size:16px;font-size:4.8cqw;color:var(--ink3)}

.legend{display:flex;justify-content:center;gap:22px;margin-top:12px;font-size:15px;color:var(--ink2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:1px;margin-right:6px}

/* ---------- 日期长条 ---------- */
.strip-wrap{position:relative;margin:10px 0 28px}
.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 calc(50% - var(--cw) / 2);-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.cell{position:relative;flex:0 0 var(--cw);scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;padding:11px 0 3px}
.cell .w{font-size:11px;color:var(--ink3);line-height:1}
.cell.we .w{color:var(--coral)}
.cell.fest .w{color:var(--coral);font-weight:700}
.cell .n{width:35px;height:35px;margin-top:5px;border-radius:12px;display:grid;place-items:center;font-family:var(--num);font-weight:500;font-size:19px;line-height:1;color:var(--ink2);transition:background .2s,color .2s}
.cell.ev .n{color:var(--ink);background:var(--blue-ll)}
.cell .dot{width:4px;height:4px;border-radius:50%;margin-top:4px;background:transparent}
.cell.ev .dot{background:var(--blue)}
.cell.on .n{background:var(--blue-soft);color:#fff;box-shadow:0 6px 12px -8px rgba(43,107,255,.45)}
.cell.prev,.cell.next{opacity:.35;pointer-events:none}
.cell.prev .n,.cell.next .n{background:transparent}

/* ---------- 纪事导航 ---------- */
.evnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 0}
.evnav button{width:40px;height:40px;border-radius:10px;background:transparent;border:none;font-size:26px;color:var(--blue);display:flex;align-items:center;justify-content:center;transition:.2s;box-shadow:2px 2px 3px rgba(0,0,0,0.15),3px 3px 8px rgba(0,0,0,0.1),inset 0 1px 2px rgba(255,255,255,0.5);line-height:1}
.evnav button:not(:disabled):active{background:var(--blue-ll)}
.evnav button:disabled{color:var(--ink3);opacity:.35;cursor:default}
.evnav span{font-size:13px;color:var(--blue-soft);text-align:center;font-weight:600;height:40px;line-height:40px;display:inline-block}

.filter-toggle{z-index:10;display:inline-flex;align-items:center}
.filter-slider{display:flex;position:relative;background:#fff;border-radius:99px;padding:3px;gap:2px;box-shadow:0 4px 12px rgba(43,107,255,0.08),0 2px 4px rgba(0,0,0,0.04),inset 0 1px 2px rgba(255,255,255,0.8);border:1px solid rgba(213,223,240,0.6);transition:all .3s ease;height:32px;align-items:center}
.filter-slider:hover{box-shadow:0 6px 16px rgba(43,107,255,0.12),0 3px 6px rgba(0,0,0,0.06),inset 0 1px 2px rgba(255,255,255,0.8);transform:translateY(-1px)}
.filter-option{padding:5px 14px;border-radius:99px;font-size:12px;font-weight:600;color:#8B9DC3;cursor:pointer;transition:all .3s cubic-bezier(0.4, 0, 0.2, 1);position:relative;z-index:2;user-select:none;white-space:nowrap}
.filter-option.active{color:#fff}
.filter-option:hover:not(.active){color:#5A7BA8}
.filter-indicator{position:absolute;top:3px;left:3px;height:calc(100% - 6px);border-radius:99px;background:linear-gradient(135deg,#6B95F2 0%,#3A6BD4 100%);transition:transform .4s cubic-bezier(0.34, 1.56, 0.64, 1),width .3s cubic-bezier(0.4, 0, 0.2, 1);z-index:1;box-shadow:0 2px 8px rgba(43,107,255,0.35),inset 0 1px 2px rgba(255,255,255,0.3)}

body.filter-major .dial-box .ev-tick:not(.major){stroke:#D5DFF0 !important;opacity:.3}
body.filter-major .dial-box .ev-tick.major{stroke:#C8DAFF !important;stroke-width:3.5}
.dial-box .ev-tick.major{stroke:#C8DAFF !important}

body.filter-major .story.major h3{color:var(--ink)}

/* ---------- 当日正文 ---------- */
.col-r{margin-top:26px;min-height:320px;background:var(--white);border:1px solid #D5DFF0;border-radius:26px;padding:24px var(--pad) 8px;margin-left:calc(-1 * var(--pad) + 8px);margin-right:calc(-1 * var(--pad) + 8px);box-shadow:3px 3px 5px rgba(0,0,0,0.12),6px 6px 18px rgba(0,0,0,0.08),inset 0 1px 3px rgba(255,255,255,0.7)}
.sv-head{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.sv-head .big{font-family:var(--num);font-weight:700;font-size:58px;line-height:.9;color:var(--blue);letter-spacing:-.03em}
.sv-head .meta{font-size:14px;color:var(--ink3);line-height:1.6}
.sv-head .meta b{display:block;font-size:16px;color:var(--ink);font-weight:700;width:100%}
.sv-head .meta span{display:block;font-size:14px;color:var(--ink3);width:100%}
.story{padding:12px 0 16px;border-bottom:1px solid var(--line);animation:fade .45s ease both}
.story::after{content:'';display:block;clear:both}
.story:last-child{border-bottom:0}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.story .tag{display:inline-block;padding:4px 13px;border-radius:99px;background:var(--blue-l);color:var(--blue2);font-size:15px;font-weight:700;box-shadow:1px 1px 2px rgba(0,0,0,0.15),2px 2px 5px rgba(0,0,0,0.1),inset 0 1px 2px rgba(255,255,255,0.5)}
.story .tag.gold{background:#FFF2DC;color:#B66A00;box-shadow:1px 1px 2px rgba(0,0,0,0.15),2px 2px 5px rgba(0,0,0,0.1),inset 0 1px 2px rgba(255,255,255,0.6)}
.story h3{font-size:23px;font-weight:700;line-height:1.6;margin:10px 0 20px;text-align:justify;letter-spacing:.5px}
.story p{font-size:16.8px;color:var(--ink2);line-height:1.75;margin-top:1.4em;text-align:justify}
.ph{display:grid;gap:4px 8px;margin:20px 0 12px}
.ph.n2,.ph.n4{grid-template-columns:1fr 1fr}
.ph.n5{grid-template-columns:repeat(6,1fr);gap:4px 5px}
.ph.n5 figure:nth-child(-n+2){grid-column:span 3}
.ph.n5 figure:nth-child(n+3){grid-column:span 2}
.ph.n5 img{height:100px;width:100%;object-fit:cover}
.ph.n6{grid-template-columns:repeat(3,1fr);gap:4px 5px}
.ph.n3{grid-template-columns:repeat(3,1fr);gap:5px}
.ph.n3 img{aspect-ratio:4/3;max-height:120px;width:100%;object-fit:cover}
.ph.square{background:transparent}
.ph.square figure{background:transparent;overflow:visible}
.ph.square img{aspect-ratio:1/1;object-fit:contain;object-position:center}
.ph.image-top img{object-position:center 15%}
.ph.image-bottom img{object-position:center 35%}
.ph figure{overflow:hidden;background:var(--blue-ll);cursor:zoom-in;border-radius:8px;box-shadow:2px 2px 3px rgba(0,0,0,0.4),5px 5px 15px rgba(0,0,0,0.25),inset 0 1px 3px rgba(255,255,255,0.6)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:21/9;object-position:center 25%}
.ph.n1 img{aspect-ratio:16/9}
.ph.n1 figure{width:75%;margin:0 auto}
.ph.long-image img{aspect-ratio:unset;height:auto}
.ph.n2 img{aspect-ratio:4/3}
.ph.n4 img{height:110px;width:100%;object-fit:cover}
.ph.n6{grid-template-columns:repeat(3,1fr);gap:6px}
.ph.n6 img{height:80px;width:100%;object-fit:cover;aspect-ratio:4/3}
.ph.n6 figure{border-radius:6px}
.ph-v{float:left;width:38%;margin:0 20px 12px 0}
.ph-v figure{overflow:visible}
.ph-v img{aspect-ratio:3/4;height:auto;max-height:200px;object-fit:contain}
.story-v{display:flex;gap:20px;align-items:center}
.story-v .ph-v{flex:none;width:28%;margin:0}
.story-v-text{flex:1;min-width:0}
.story-v-text h3{margin-top:0}
.void{padding:32px 0 24px;text-align:center}
.void img{width:75%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;margin:0 auto 13px;display:block;box-shadow:2px 2px 3px rgba(0,0,0,0.4),5px 5px 15px rgba(0,0,0,0.25),inset 0 1px 3px rgba(255,255,255,0.6)}
.void .q{font-size:14px;color:var(--ink2);line-height:1.75;text-align:center;font-style:italic}

/* ---------- 一览 ---------- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:52px 0 6px}
.sec-h h2{font-size:24px;font-weight:700}
.sec-h span{font-size:14px;color:var(--ink3)}
.ix{display:grid;grid-template-columns:1fr;column-gap:24px}
.ix-m{padding-top:18px}
.ix-h{display:flex;align-items:baseline;gap:8px;font-size:14px;color:var(--ink3);margin-bottom:6px}
.ix-h b{font-family:var(--num);font-weight:700;font-size:24px;color:var(--ink)}
.ix ul{list-style:none;background:var(--white);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ix li{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:14px 16px;cursor:pointer}
.ix li+li{border-top:1px solid var(--line)}
.ix li:active{background:var(--blue-ll)}
.ix .dd{font-family:var(--num);font-weight:700;font-size:20px;color:var(--blue)}
.ix .tt{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ix .tg{font-size:12px;color:var(--ink3)}

footer.wrap{margin-top:40px;padding:34px 0 calc(48px + env(safe-area-inset-bottom));text-align:center}
footer .y{font-family:var(--num);font-weight:700;font-size:clamp(52px,8vw,58px);line-height:1;letter-spacing:-.03em;text-shadow:1.5px -1.5px 1.5px rgba(0,0,0,0.25),-1.5px -1.5px 1.5px rgba(255,255,255,0.7)}
footer .y em{font-style:normal;color:var(--blue)}
footer p{font-size:clamp(17px,2.5vw,20px);color:var(--ink2);margin-top:20px;letter-spacing:.16em}
.wish-btn{display:inline-flex;align-items:center;gap:10px;margin-top:20px;height:56px;padding:0 30px;border-radius:99px;
  background:var(--blue-soft);color:#fff;font-size:18px;font-weight:700;letter-spacing:.12em;box-shadow:2px 2px 3px rgba(0,0,0,0.2),4px 4px 12px rgba(43,107,255,0.25),inset 0 1px 3px rgba(255,255,255,0.5);transition:transform .15s}
.wish-btn:active{transform:scale(.96)}
.wish-btn svg{width:22px;height:22px}

/* ---------- 祝福弹层 + 烟花 ---------- */
.wish{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;
  background:rgba(245,248,255,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .4s}
.wish.on{opacity:1;pointer-events:auto}
.wish canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wish-in{position:relative;z-index:1;max-width:460px;width:100%}
.wish-k{display:inline-block;padding:6px 16px;border-radius:99px;background:var(--white);border:1px solid var(--line);font-size:15px;color:var(--ink2);letter-spacing:.12em;box-shadow:1px 1px 2px rgba(0,0,0,0.1),2px 2px 5px rgba(0,0,0,0.08),inset 0 1px 2px rgba(255,255,255,0.6)}
.wish h3{margin-top:18px;font-size:56px;font-weight:700;letter-spacing:.14em;color:var(--blue);line-height:1.2;opacity:0;text-shadow:1.5px -1.5px 1.5px rgba(0,0,0,0.25),-1.5px -1.5px 1.5px rgba(255,255,255,0.7)}
.wish p{margin-top:16px;font-size:21px;font-weight:700;color:var(--ink);line-height:1.5;opacity:0}
.wish p.poem{margin-top:22px;padding:16px 6px 14px;font-size:26px;letter-spacing:.06em;color:var(--blue2);line-height:1.7}
.wish p.poem .pb{display:inline-block;text-align:left;margin-right:-.06em}
.wish p.poem .pb span{display:block}
.wish p.poem cite{display:block;margin-top:6px;font-size:15px;font-style:normal;font-weight:400;letter-spacing:.1em;color:var(--ink3)}
.wish.on h3{animation:up .6s .15s ease forwards}
.wish.on p{animation:up .6s ease forwards}
.wish-tip{margin-top:30px;font-size:15px;color:var(--ink3);opacity:0}
.wish.on .wish-tip{animation:up .6s 2.2s ease forwards}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- 吸顶迷你条（手机） ---------- */
.mini{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:20;display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:6px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 24px -14px rgba(15,27,51,.35);transform:translateY(-140%);transition:transform .3s}
.mini.on{transform:none}
.mini button.ar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;color:var(--blue);background:var(--blue-ll)}
.mini button.ar:disabled{opacity:.3}
.mini .md{flex:1;min-width:0;text-align:center;line-height:1.3}
.mini .md b{font-family:var(--num);font-weight:700;font-size:20px}
.mini .md span{display:block;font-family:var(--num);font-weight:600;font-size:13px;color:var(--blue-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 12px;margin:2px auto;width:fit-content}

.lb{position:fixed;inset:0;z-index:30;background:rgba(245,248,255,.97);display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb.on{display:flex;animation:fade .25s}
.lb img{max-width:100%;max-height:100%;border-radius:12px}

/* ================= 移动端适配 ================= */
@media (max-width:699px){
  .filter-option{font-size:11px;padding:4px 10px}
  .filter-slider{min-width:clamp(140px,36vw,200px);justify-content:center}
}

/* ================= 平板 / 电脑 ================= */
@media (min-width:700px){
  :root{--pad:32px}
  .col-r{margin-left:0;margin-right:0;padding:28px 32px 10px}
  .ix{grid-template-columns:1fr 1fr}
}
@media (min-width:1000px){
  :root{--pad:40px}
  .main{display:grid;grid-template-columns:460px 1fr;column-gap:56px;align-items:stretch}
  .col-l{padding:20px 0 0}
  .col-r{margin-top:20px;min-height:0;contain:size;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#D5DFF0 transparent}
  .col-r::-webkit-scrollbar{width:6px}
  .col-r::-webkit-scrollbar-track{background:transparent}
  .col-r::-webkit-scrollbar-thumb{background:#D5DFF0;border-radius:3px}

<script>
(() => {
'use strict';
const Y = 2026, N = 365, STEP = 360 / N, C = 200;
let CW = 58;
const EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WDE = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const CN = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
const NUM = ['〇','一','二','三','四','五','六','七','八','九'];
const WD = '日一二三四五六';
const FEST = {'2026-01-01':'元旦','2026-02-17':'春节','2026-03-03':'元宵','2026-04-05':'清明','2026-05-01':'劳动节','2026-06-19':'端午','2026-08-19':'七夕','2026-09-25':'中秋','2026-10-01':'国庆','2026-10-18':'重阳','2026-12-21':'冬至'};
const GOLD = '高光';

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const mod = (a, n) => ((a % n) + n) % n;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D0 = new Date(Y, 0, 1);
const dateOf = i => new Date(Y, 0, 1 + i);
const keyOf = i => { const d = dateOf(i); return `${Y}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const idxOf = k => { const [y, m, d] = k.split('-').map(Number); return Math.round((new Date(y, m - 1, d) - D0) / 864e5); };
const cnNum = d => d < 10 ? NUM[d] : d === 10 ? '十' : d < 20 ? '十' + NUM[d - 10] : NUM[Math.floor(d / 10)] + '十' + (d % 10 ? NUM[d % 10] : '');
const mStart = [...Array(12)].map((_, m) => Math.round((new Date(Y, m, 1) - D0) / 864e5));
const mLen = m => new Date(Y, m + 1, 0).getDate();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 数据 ---------- */
const byIdx = {};
(window.EVENTS || []).filter(e => e && /^2026-\d\d-\d\d$/.test(e.date))
  .sort((a, b) => a.date.localeCompare(b.date))
  .forEach(e => (byIdx[idxOf(e.date)] ||= []).push(e));
const evDays = Object.keys(byIdx).map(Number).sort((a, b) => a - b);
const isGold = i => (byIdx[i] || []).some(e => e.tag === GOLD);
const isMajor = i => (byIdx[i] || []).some(e => e.major === true);
const majorDays = evDays.filter(i => isMajor(i));

/* ---------- 状态 ---------- */
let rot = 0, sel = -1, storyShown = -1, raf = 0, storyT = 0, lockUntil = 0;
const now = new Date();
const startIdx = 0;

/* ================= 年轮 ================= */
const NS = 'http://www.w3.org/2000/svg';
const dial = $('#dial'), dialBox = $('#dialBox');
const el = (t, a, p) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); p && p.appendChild(n); return n; };
const P = (r, deg) => { const a = (deg - 90) * Math.PI / 180; return [C + r * Math.cos(a), C + r * Math.sin(a)]; };
let ring, labels = [], evTicks = [];
const arcPath = (r1, r2, a1, a2) => {
  const [x1, y1] = P(r2, a1), [x2, y2] = P(r2, a2), [x3, y3] = P(r1, a2), [x4, y4] = P(r1, a1);
  return `M${x1} ${y1}A${r2} ${r2} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 0 0 ${x4} ${y4}Z`;
};

(function buildDial() {
  const defs = el('defs', {}, dial);
  const f = el('filter', {id: 'sh', x: '-20%', y: '-20%', width: '140%', height: '140%'}, defs);
  el('feDropShadow', {dx: 0, dy: 10, stdDeviation: 12, 'flood-color': '#2B6BFF', 'flood-opacity': .12}, f);
  el('circle', {cx: C, cy: C, r: 194, fill: '#FFFFFF', filter: 'url(#sh)'}, dial);
  el('circle', {cx: C, cy: C, r: 194, fill: 'none', stroke: '#E2E9F6', 'stroke-width': 1}, dial);
  el('circle', {cx: C, cy: C, r: 90, fill: '#F5F8FF'}, dial);

  ring = el('g', {}, dial);
  for (let m = 0; m < 12; m++) {
    const [x1, y1] = P(106, mStart[m] * STEP), [x2, y2] = P(150, mStart[m] * STEP);
    el('line', {x1, y1, x2, y2, stroke: '#D5DFF0', 'stroke-width': 1}, ring);
  }
  evTicks = [];
  for (let i = 0; i < N; i++) {
    const d = dateOf(i).getDate(), has = !!byIdx[i], g = isGold(i), maj = isMajor(i), deg = i * STEP;
    const r1 = has ? 167 : d === 1 ? 173 : d % 5 === 0 ? 177 : 180;
    const [x1, y1] = P(r1, deg), [x2, y2] = P(184, deg);
    const line = el('line', {x1, y1, x2, y2, 'stroke-linecap': 'round',
      stroke: has ? '#C8DAFF' : d === 1 ? '#8E9AB2' : '#C3CEE2',
      'stroke-width': has ? 3 : d === 1 ? 1.4 : .9,
      class: has ? (maj ? 'ev-tick major' : 'ev-tick') : ''}, ring);
    if (has) evTicks[i] = line;
  }
  for (let m = 0; m < 12; m++) {
    const t = el('text', {'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-family': 'NSans, sans-serif', 'font-size': 20}, dial);
    t.textContent = `${m + 1}月`; labels.push(t);
  }
  // 固定指针（下方）
  el('path', {d: `M${C - 7} 398 h14 l-7 -10 z`, fill: '#2B6BFF'}, dial);
  el('line', {x1: C, y1: 388, x2: C, y2: 350, stroke: '#2B6BFF', 'stroke-width': 2, 'stroke-linecap': 'round'}, dial);
})();

function placeLabels() {
  const cm = sel >= 0 ? dateOf(sel).getMonth() : -1;
  labels.forEach((t, m) => {
    const [x, y] = P(128, (mStart[m] + mLen(m) / 2) * STEP + rot);
    t.setAttribute('x', x.toFixed(1)); t.setAttribute('y', y.toFixed(1));
    t.setAttribute('fill', m === cm ? '#2B6BFF' : '#4B5A75');
    t.setAttribute('font-weight', m === cm ? 700 : 400);
  });
}
function setRot(r, src) {
  rot = r;
  ring.setAttribute('transform', `rotate(${rot.toFixed(3)} ${C} ${C})`);
  const i = mod(Math.round((180 - rot) / STEP), N);
  if (i !== sel) {
    if (evTicks[sel]) { evTicks[sel].setAttribute('stroke', '#C8DAFF'); evTicks[sel].setAttribute('stroke-width', '3'); }
    if (evTicks[i]) { evTicks[i].setAttribute('stroke', '#2B6BFF'); evTicks[i].setAttribute('stroke-width', '4'); }
    const prev = sel; sel = i; onSel(src, prev);
  }
  placeLabels();
}
const nearRot = i => { let t = 180 - i * STEP; while (t - rot > 180) t -= 360; while (t - rot < -180) t += 360; return t; };
let finT = 0;
const stop = () => { cancelAnimationFrame(raf); clearTimeout(finT); };
function animateTo(i, dur, skipScroll) {
  stop();
  const to = nearRot(i), from = rot, t0 = performance.now();
  dur = reduce ? 0 : (dur ?? Math.min(900, 280 + Math.abs(to - from) * 3));
  const step = t => {
    const p = dur ? Math.min(1, (t - t0) / dur) : 1, e = 1 - Math.pow(1 - p, 3);
    setRot(from + (to - from) * e, 'anim');
    if (p < 1) raf = requestAnimationFrame(step); else { clearTimeout(finT); flushStory(); desktopScrollTop(); }
  };
  raf = requestAnimationFrame(step);
  finT = setTimeout(() => { cancelAnimationFrame(raf); setRot(to, 'anim'); flushStory(); desktopScrollTop(); }, dur + 120);
}
function fwdTo(i) {
  stop();
  let to = 180 - i * STEP;
  let diff = rot - to;
  diff = ((diff % 360) + 360) % 360;
  to = rot - diff;
  if (diff === 0) to -= 360;
  const from = rot, t0 = performance.now();
  const dur = reduce ? 0 : Math.min(900, 280 + Math.abs(to - from) * 3);
  const step = t => {
    const p = dur ? Math.min(1, (t - t0) / dur) : 1, e = 1 - Math.pow(1 - p, 3);
    setRot(from + (to - from) * e, 'anim');
    if (p < 1) raf = requestAnimationFrame(step); else { clearTimeout(finT); flushStory(); desktopScrollTop(); }
  };
  raf = requestAnimationFrame(step);
  finT = setTimeout(() => { cancelAnimationFrame(raf); setRot(to, 'anim'); flushStory(); desktopScrollTop(); }, dur + 120);
}
function bwdTo(i) {
  stop();
  let to = 180 - i * STEP;
  let diff = to - rot;
  diff = ((diff % 360) + 360) % 360;
  to = rot + diff;
  if (diff === 0) to += 360;
  const from = rot, t0 = performance.now();
  const dur = reduce ? 0 : Math.min(900, 280 + Math.abs(to - from) * 3);
  const step = t => {
    const p = dur ? Math.min(1, (t - t0) / dur) : 1, e = 1 - Math.pow(1 - p, 3);
    setRot(from + (to - from) * e, 'anim');
    if (p < 1) raf = requestAnimationFrame(step); else { clearTimeout(finT); flushStory(); desktopScrollTop(); }
  };
  raf = requestAnimationFrame(step);
  finT = setTimeout(() => { cancelAnimationFrame(raf); setRot(to, 'anim'); flushStory(); desktopScrollTop(); }, dur + 120);
}
// 磁吸：松手时若附近 3 天内有纪事，自动吸附过去
function magnet(i, r = 3) {
  const days = document.body.classList.contains('filter-major') ? majorDays : evDays;
  let best = i, bd = r + 1;
  for (const e of days) { const d = Math.min(mod(e - i, N), mod(i - e, N)); if (d < bd) { bd = d; best = e; } }
  return best;
}

/* ---------- 拖动 + 惯性 ---------- */
(function drag() {
  let on = false, last = 0, lastT = 0, moved = 0, vel = 0, cool = 0;
  const SENS = .35;
  const ang = e => { const b = dial.getBoundingClientRect(); return Math.atan2(e.clientY - b.top - b.height / 2, e.clientX - b.left - b.width / 2) * 180 / Math.PI; };
  const DEAD = .72;
  dial.addEventListener('pointerdown', e => { if (cool) return; const b = dial.getBoundingClientRect(), dx = e.clientX - b.left - b.width / 2, dy = e.clientY - b.top - b.height / 2, r = Math.hypot(dx, dy) / (b.width / 2); if (r < DEAD || r > 1.05) return; e.preventDefault(); stop(); on = true; moved = 0; vel = 0; last = ang(e); lastT = e.timeStamp; dial.setPointerCapture(e.pointerId); });
  dial.addEventListener('pointermove', e => {
    if (!on) return; e.preventDefault();
    const a = ang(e); let d = a - last; if (d > 180) d -= 360; if (d < -180) d += 360;
    d *= SENS;
    const dt = Math.max(1, e.timeStamp - lastT);
    vel = .7 * (d / dt) + .3 * vel; last = a; lastT = e.timeStamp; moved += Math.abs(d);
    setRot(rot - d, 'drag');
  });
  const end = e => {
    if (!on) return; on = false; cool = 1; setTimeout(() => { cool = 0; }, 100);
    if (moved < 3) { // 轻点：直接跳到点到的那一天
      const b = dial.getBoundingClientRect(), dx = e.clientX - b.left - b.width / 2, dy = e.clientY - b.top - b.height / 2;
      const deg = Math.atan2(dy, dx) * 180 / Math.PI + 90;
      return animateTo(magnet(mod(Math.round((deg - rot) / STEP), N), 2));
    }
    if (Math.abs(vel) > .12 && e.timeStamp - lastT < 90 && !reduce) inertia(vel); else animateTo(magnet(sel), 360);
  };
  dial.addEventListener('pointerup', end);
  dial.addEventListener('pointercancel', end);
  function inertia(v) {
    let t0 = performance.now();
    const step = t => {
      const dt = t - t0; t0 = t;
      v *= Math.pow(.92, dt / 16);
      setRot(rot - v * dt, 'drag');
      if (Math.abs(v) > .015) raf = requestAnimationFrame(step); else animateTo(magnet(sel), 380);
    };
    raf = requestAnimationFrame(step);
  }
})();
$('#dialC').addEventListener('click', () => { if (byIdx[sel]) { mobileScroll(); desktopScrollTop(); } });

function desktopScrollTop() {
  if (window.innerWidth > 768) {
    const colR = document.querySelector('.col-r');
    if (colR) colR.scrollTop = 0;
  }
}

function mobileScroll() {
  if (window.innerWidth <= 768) {
    const el = $('#story'), rect = el.getBoundingClientRect();
    window.scrollTo({top: window.scrollY + rect.top - 80, behavior: 'smooth'});
  }
}

/* ================= 日期长条 ================= */
const strip = $('#strip');
// 1月1日是周四，前面补12月28-31日（周日到周三）作为占位
const prevDays = [{d:28,w:0},{d:29,w:1},{d:30,w:2},{d:31,w:3}];
const prevHTML = prevDays.map(x => `<button class="cell prev" disabled><span class="w">${WD[x.w]}</span><span class="n">${x.d}</span><span class="dot"></span></button>`).join('');
// 12月31日后补2027年1月1-3日（周五到周日）作为占位

(function filterMode() {
  const options = document.querySelectorAll('.filter-option');
  const indicator = document.querySelector('.filter-indicator');
  const slider = document.querySelector('.filter-slider');
  let currentFilter = 'all';
  
  function updateIndicator() {
    const activeOption = document.querySelector('.filter-option.active');
    if (!activeOption || !indicator || !slider) return;
    
    const sliderRect = slider.getBoundingClientRect();
    const optionRect = activeOption.getBoundingClientRect();
    const offsetLeft = optionRect.left - sliderRect.left;
    
    indicator.style.width = optionRect.width + 'px';
    indicator.style.transform = `translateX(${offsetLeft - 3}px)`;
  }
  
  options.forEach(option => {
    option.addEventListener('click', () => {
      const filter = option.dataset.filter;
      if (filter === currentFilter) return;
      
      currentFilter = filter;
      options.forEach(o => o.classList.remove('active'));
      option.classList.add('active');
      
      if (filter === 'major') {
        document.body.classList.add('filter-major');
        // Auto-navigate to first major event if current selection is not major
        if (!majorDays.includes(sel) && majorDays.length > 0) {
          fwdTo(majorDays[0]);
        }
      } else {
        document.body.classList.remove('filter-major');
      }
      
      updateIndicator();
      updateCounter();
    });
  });
  
  function updateCounter() {
    if (currentFilter === 'major') {
      const majorIdx = majorDays.indexOf(sel);
      if (majorIdx >= 0) {
        const text = `第 ${majorIdx + 1} / ${majorDays.length} 件`;
        $('#navInfo').textContent = text;
        $('#mSub').textContent = text;
      }
    } else {
      const k2 = evDays.indexOf(sel);
      if (k2 >= 0) {
        const text = `第 ${k2 + 1} / ${evDays.length} 件`;
        $('#navInfo').textContent = text;
        $('#mSub').textContent = text;
      }
    }
  }
  
  window.updateFilterCounter = updateCounter;
  
  // Initialize indicator position after DOM is ready
  setTimeout(updateIndicator, 100);
  window.addEventListener('resize', updateIndicator);
})();

      shadow.innerHTML = `<style>${css}</style><div class="veil"></div><canvas aria-hidden="true"></canvas>
        <div class="kicker" aria-hidden="true">致敬每一个高光瞬间</div>
        <div class="foot" aria-hidden="true">致敬每一位同行的你</div>
        <button class="skip" type="button">跳过动画</button>`;
      this.shadow = shadow;
      this.canvas = shadow.querySelector('canvas');
      this.ctx = this.canvas.getContext('2d');
      this.veil = shadow.querySelector('.veil');
      this.kicker = shadow.querySelector('.kicker');
      this.foot = shadow.querySelector('.foot');
      this.skip = shadow.querySelector('.skip');
      this.skip.addEventListener('click', () => this.finish('skipped', true));
      this.onKey = e => { if (e.key === 'Escape' && this.running) { e.preventDefault(); this.finish('skipped', true); } };
      this.host.addEventListener('keydown', this.onKey);
      this.container.appendChild(this.host);
      this.onVisibility = () => {
        if (!this.running) return;
        if (document.hidden) this.pausedAt = performance.now();
        else if (this.pausedAt != null) {
          this.startedAt += performance.now() - this.pausedAt;
          this.pausedAt = null;
        }
      };
      document.addEventListener('visibilitychange', this.onVisibility);
      this.resizeObserver = new ResizeObserver(() => {
        if (this.running && !this.reduced) this.build();
      });
      this.resizeObserver.observe(this.container);
    }

    play() {
      if (this.destroyed) return Promise.resolve({ reason: 'destroyed' });
      if (this.running) return this.promise;
      this.running = true;
      this.revealed = false;
      this.previousFocus = document.activeElement;
      this.inertElements = Array.from(this.container.children).filter(el => el !== this.host)
        .map(el => ({ el, inert: el.inert }));
      this.inertElements.forEach(({ el }) => { el.inert = true; });
      this.host.hidden = false;
      this.host.style.opacity = '1';
      this.skip.focus({ preventScroll: true });
      this.promise = new Promise(resolve => { this.resolve = resolve; });
      this.startedAt = performance.now();
      this.pausedAt = document.hidden ? this.startedAt : null;
      this.reduced = matchMedia('(prefers-reduced-motion: reduce)').matches || !this.ctx;
      this.kicker.style.opacity = '0';
      this.foot.style.opacity = '0';
      this.veil.style.opacity = '0';
      this.skip.style.opacity = '0';
      if (this.reduced) {
        this.canvas.style.display = 'none';
        this.still = document.createElement('div');
        this.still.className = 'still';
        this.lines.forEach((line, i) => {
          if (i) this.still.appendChild(document.createElement('br'));
          this.still.appendChild(document.createTextNode(line));
        });
        this.shadow.appendChild(this.still);
      } else {
        this.canvas.style.display = 'block';
        this.build();
      }
      this.tick = this.tick.bind(this);
      this.raf = requestAnimationFrame(this.tick);
      return this.promise;
    }

    build() {
      const rect = this.host.getBoundingClientRect();
      this.w = Math.max(1, rect.width);
      this.h = Math.max(1, rect.height);
      this.dpr = Math.min(devicePixelRatio || 1, 2);
      this.canvas.width = Math.round(this.w * this.dpr);
      this.canvas.height = Math.round(this.h * this.dpr);
      this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      let seed = 2026;
      const random = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
      const mask = document.createElement('canvas');
      mask.width = Math.ceil(this.w);
      mask.height = Math.ceil(this.h);
      const m = mask.getContext('2d', { willReadFrequently: true });
      const fontFamily = this.options.fontFamily || '"PingFang SC", "Microsoft YaHei", sans-serif';
      let font = Math.min(42, this.w * .076) + 2;
      const tracking = font * .085;
      const lineWidth = (line, size) => {
        m.font = `600 ${size}px ${fontFamily}`;
        return [...line].reduce((sum, ch) => sum + m.measureText(ch).width, 0) + Math.max(0, [...line].length - 1) * tracking;
      };
      const widest = Math.max(...this.lines.map(line => lineWidth(line, font)));
      if (widest > this.w * .88) font *= this.w * .88 / widest;
      this.fontSize = font;
      const lineHeight = font * 1.85;
      this.centerY = this.h * .44;
      m.fillStyle = '#fff';
      m.textBaseline = 'middle';
      const rows = [];
      this.lines.forEach((line, i) => {
        const size = font;
        let x = (this.w - lineWidth(line, size)) / 2;
        const y = this.centerY + (i - (this.lines.length - 1) / 2) * lineHeight;
        m.font = `600 ${size}px ${fontFamily}`;
        for (const ch of line) { m.fillText(ch, x, y); x += m.measureText(ch).width + tracking; }
        rows.push(y);
      });
      this.mask = mask;
      this.ink = document.createElement('canvas');
      this.ink.width = mask.width; this.ink.height = mask.height;
      const ic = this.ink.getContext('2d');
      ic.drawImage(mask, 0, 0);
      ic.globalCompositeOperation = 'source-in';
      const inkGradient = ic.createLinearGradient(0, this.centerY - 55, 0, this.centerY + 65);
      inkGradient.addColorStop(0, '#4A7FE0');
      inkGradient.addColorStop(.46, '#6B95F2');
      inkGradient.addColorStop(1, '#3A6BD4');
      ic.fillStyle = inkGradient; ic.fillRect(0, 0, this.w, this.h);
      const data = m.getImageData(0, 0, mask.width, mask.height).data;
      const points = [];
      const step = this.w < 480 ? 1.65 : 1.8;
      const top = Math.max(0, Math.floor(rows[0] - font));
      const bottom = Math.min(mask.height, Math.ceil(rows[rows.length - 1] + font));
      for (let y = top; y < bottom; y += step) {
        for (let x = 0; x < this.w; x += step) {
          if (data[(Math.floor(y) * mask.width + Math.floor(x)) * 4 + 3] > 95) points.push({ x, y });
        }
      }
      for (let i = points.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [points[i], points[j]] = [points[j], points[i]];
      }
      const cap = this.w < 480 ? 2300 : 3200;
      this.particles = points.slice(0, cap).map(({ x, y }) => {
        const angle = random() * Math.PI * 2;
        const radius = Math.max(this.w, this.h * .62) * (.38 + random() * .48);
        const sx = this.w / 2 + Math.cos(angle) * radius;
        const sy = this.centerY + Math.sin(angle) * radius * .72;
        const exitAngle = Math.atan2(y - this.centerY, x - this.w / 2) + (random() - .5) * 1.35;
        const distance = Math.max(this.w, this.h) * (.32 + random() * .52);
        return { x, y, sx, sy,
          cx: mix(sx, x, .54) + Math.sin(angle) * 80,
          cy: mix(sy, y, .54) - Math.cos(angle) * 90,
          ex: x + Math.cos(exitAngle) * distance,
          ey: y + Math.sin(exitAngle) * distance * .56 - 50,
          delay: random() * .115 + (x / this.w) * .035,
          leaveDelay: random() * .05 + (x / this.w) * .035,
          size: .45 + random() * .6, phase: random() * Math.PI * 2,
          shade: Math.floor(random() * 5), shimmer: random() > .971
        };
      });
      this.dust = Array.from({ length: this.w < 480 ? 52 : 82 }, () => ({
        x: random() * this.w, y: random() * this.h, r: .5 + random() * 1.6,
        phase: random() * Math.PI * 2, speed: 7 + random() * 16
      }));
      this.glow = document.createElement('canvas');
      this.glow.width = this.glow.height = 40;
      const gc = this.glow.getContext('2d');
      const gradient = gc.createRadialGradient(20, 20, 0, 20, 20, 20);
      gradient.addColorStop(0, 'rgba(180,210,255,.95)');
      gradient.addColorStop(.16, 'rgba(107,149,242,.55)');
      gradient.addColorStop(.48, 'rgba(74,127,224,.12)');
      gradient.addColorStop(1, 'rgba(74,127,224,0)');
      gc.fillStyle = gradient; gc.fillRect(0, 0, 40, 40);
    }

    tick(now) {
      if (!this.running) return;
      if (this.pausedAt != null) { this.raf = requestAnimationFrame(this.tick); return; }
      const p = clamp((now - this.startedAt) / (this.reduced ? 1200 : this.duration));
      if (this.reduced) {
        this.veil.style.opacity = '1';
        this.skip.style.opacity = '1';
        if (p === 1) { this.finish('completed', true); return; }
      } else {
        const veilIn = smooth(p / .15);
        const ending = smooth((p - .85) / .15);
        this.veil.style.opacity = String(veilIn * (1 - ending));
        this.kicker.style.opacity = String(smooth((p - .23) / .15) * (1 - smooth((p - .85) / .10)) * .9);
        this.foot.style.opacity = String(smooth((p - .36) / .14) * (1 - smooth((p - .87) / .10)));
        this.skip.style.opacity = String(veilIn * (1 - ending));
        this.draw(p, (now - this.startedAt) / 1000);
        if (p >= .85) this.reveal();
        if (p === 1) { this.finish('completed', true); return; }
      }
      this.raf = requestAnimationFrame(this.tick);
    }

    draw(p, time) {
      const c = this.ctx;
      const colors = ['#4A7FE0', '#5A8AE8', '#6B95F2', '#7BA3F5', '#8BB5F8'];
      c.clearRect(0, 0, this.w, this.h);
      const ambient = smooth(p / .11) * (1 - smooth((p - .76) / .2));
      for (const d of this.dust) {
        const x = d.x + Math.sin(time * .24 + d.phase) * 12;
        const y = (d.y - time * d.speed + this.h * 2) % this.h;
        c.globalAlpha = ambient * (.24 + .19 * Math.sin(time * .9 + d.phase));
        c.drawImage(this.glow, x - d.r * 5, y - d.r * 5, d.r * 10, d.r * 10);
        c.fillStyle = '#5A8AE8';
        c.beginPath(); c.arc(x, y, d.r * .6, 0, Math.PI * 2); c.fill();
      }
      const ink = smooth((p - .385) / .11) * (1 - smooth((p - .85) / .08));
      if (ink > 0) {
        c.globalAlpha = ink * .64;
        c.drawImage(this.ink, 0, 0);
      }
      for (const pt of this.particles) {
        const t = outCubic((p - .015 - pt.delay) / .4);
        const leave = clamp((p - .85 - pt.leaveDelay) / .10);
        const fly = outCubic(leave);
        const inv = 1 - t;
        let x = inv * inv * pt.sx + 2 * inv * t * pt.cx + t * t * pt.x;
        let y = inv * inv * pt.sy + 2 * inv * t * pt.cy + t * t * pt.y;
        x += Math.sin(time * 1.1 + pt.phase) * .24 * t;
        y += Math.cos(time * 1.3 + pt.phase) * .24 * t;
        if (leave > 0) {
          x = mix(x, pt.ex, fly);
          y = mix(y, pt.ey, fly) + Math.sin(leave * Math.PI) * Math.sin(pt.phase) * 22;
        }
        const arrivalAlpha = smooth((p - .018 - pt.delay * .2) / .075);
        const alpha = arrivalAlpha * (1 - smooth(leave)) * (.69 + .2 * Math.sin(time * 1.8 + pt.phase));
        if (alpha < .008) continue;
        const radius = pt.size * (1 + (1 - t) * .55 + fly * .24);
        c.globalAlpha = alpha;
        c.fillStyle = colors[pt.shade];
        c.beginPath(); c.arc(x, y, radius, 0, Math.PI * 2); c.fill();
        if (pt.shimmer) {
          const pulse = Math.pow(Math.max(0, Math.sin(time * 1.55 + pt.phase)), 8);
          c.globalAlpha = alpha * (.19 + pulse * .62);
          c.drawImage(this.glow, x - 9, y - 9, 18, 18);
          if (pulse > .65) {
            c.strokeStyle = '#6B95F2'; c.lineWidth = .6;
            c.beginPath(); c.moveTo(x - 3, y); c.lineTo(x + 3, y);
            c.moveTo(x, y - 3); c.lineTo(x, y + 3); c.stroke();
          }
        }
      }
      c.globalAlpha = 1;
    }

    reveal() {
      if (this.revealed) return;
      this.revealed = true;
      if (typeof this.options.onReveal === 'function') {
        try { this.options.onReveal(); } catch (error) { console.error('HighlightIntro onReveal:', error); }
      }
    }

    finish(reason, reveal) {
      if (!this.running) return;
      cancelAnimationFrame(this.raf);
      if (reveal) this.reveal();
      this.running = false;
      this.host.hidden = true;
      if (this.still) { this.still.remove(); this.still = null; }
      this.inertElements.forEach(({ el, inert }) => { el.inert = inert; });
      const result = { reason };
      this.resolve(result);
      if (typeof this.options.onComplete === 'function') {
        try { this.options.onComplete(result); } catch (error) { console.error('HighlightIntro onComplete:', error); }
      }
      if (this.previousFocus && this.previousFocus.isConnected && typeof this.previousFocus.focus === 'function') {
        this.previousFocus.focus({ preventScroll: true });
      }
    }
    cancel() { this.finish('cancelled', false); }
    destroy() {
      this.cancel();
      this.destroyed = true;
      this.resizeObserver.disconnect();
      document.removeEventListener('visibilitychange', this.onVisibility);
      this.host.removeEventListener('keydown', this.onKey);
      this.host.remove();
      if (this.adjustedPosition) this.container.style.position = this.originalPosition;
    }
  }

  // 接入逻辑
  const pageRoot = document.querySelector('.app') || document.body;
  const content = document.querySelector('.wrap.main');
  let savedVisibility = '';
  let savedDisabled = false;
  let hasPlayed = false;

  const intro = new HighlightIntro({
    container: pageRoot,
    duration: 5000,
    textLines: ['回望来路', '皆是星光'],
    onReveal() {
      content.style.visibility = savedVisibility;
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        // Set initial state first
        content.style.opacity = '0';
        content.style.transform = 'translateY(18px) scale(.96)';
        content.style.filter = 'blur(5px)';
        content.style.transition = 'none';
        
        // Force reflow
        content.offsetHeight;
        
        // Animate to final state (slower)
        content.style.transition = 'opacity 2800ms cubic-bezier(.16,1,.3,1), transform 2800ms cubic-bezier(.16,1,.3,1), filter 2800ms cubic-bezier(.16,1,.3,1)';
        content.style.opacity = '1';
        content.style.transform = 'translateY(0) scale(1)';
        content.style.filter = 'blur(0)';
      }
    },
    onComplete() {
      const btn = document.querySelector('#highlight');
      if (btn) btn.disabled = savedDisabled;
    }
  });

  // Hook into filter toggle
  const filterBtns = document.querySelectorAll('.filter-option');
  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const filter = btn.dataset.filter;
      if (filter === 'major') {
        savedVisibility = content.style.visibility;
        savedDisabled = btn.disabled;
        content.style.visibility = 'hidden';
        intro.play();
        btn.disabled = true;
      } else if (filter === 'all') {
        if (intro.running) {
          intro.cancel();
        }
        document.body.classList.remove('filter-major');
        content.style.visibility = savedVisibility;
        const highlightBtn = document.querySelector('#highlight');
        if (highlightBtn) highlightBtn.disabled = savedDisabled;
        // Re-render story to show all events
        renderStory();
        if (window.updateFilterCounter) window.updateFilterCounter();
      }
    });
  });

  window.addEventListener('beforeunload', () => {
    intro.destroy();
  });
})();

// Close main IIFE
})();
</script>
</body>
</html>
