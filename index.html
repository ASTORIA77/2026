<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F8FF">
<title>2026 · 回望来路 启航新程</title>
<style>
/* ===== 开源字体：Noto Sans SC（思源黑体）+ Outfit，均为 SIL OFL 1.1 ===== */
@font-face{font-family:"NSans";font-weight:400;font-display:swap;src:url(fonts/noto-sans-sc-chinese-simplified-400-normal.woff2) format("woff2")}
@font-face{font-family:"NSans";font-weight:700;font-display:swap;src:url(fonts/noto-sans-sc-chinese-simplified-700-normal.woff2) format("woff2")}
@font-face{font-family:"Outfit";font-weight:300;font-display:swap;src:url(fonts/outfit-latin-300-normal.woff2) format("woff2")}
@font-face{font-family:"Outfit";font-weight:500;font-display:swap;src:url(fonts/outfit-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Outfit";font-weight:700;font-display:swap;src:url(fonts/outfit-latin-700-normal.woff2) format("woff2")}

:root{
  --bg:#F5F8FF; --white:#FFFFFF;
  --ink:#0F1B33; --ink2:#4B5A75; --ink3:#8E9AB2;
  --blue:#2B6BFF; --blue2:#1847C9; --blue-l:#E6EEFF; --blue-ll:#F0F5FF; --blue-soft:#6B95F2;
  --amber:#FFA826; --coral:#FF6B5B;
  --line:#E2E9F6;
  --sans:"NSans","Noto Sans SC","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  --num:"Outfit","NSans",sans-serif;
  --pad:20px; --cw:46px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{background:var(--bg)}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.7;font-size:19px;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:radial-gradient(120% 60% at 50% -10%,#DDE8FF 0,rgba(221,232,255,0) 60%),var(--bg) no-repeat}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--pad)}

/* ================= 刊头 ================= */
.hero{padding-top:calc(22px + env(safe-area-inset-top))}
.top{display:flex;align-items:center;justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:var(--white);border:1px solid var(--line);
  font-size:13px;color:var(--ink2);letter-spacing:.06em}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--coral)}
.music{display:none;align-items:center;gap:8px;height:36px;padding:0 14px 0 6px;border-radius:99px;background:var(--white);border:1px solid var(--line);font-size:13px;color:var(--ink2);max-width:58%}
.music.ok{display:inline-flex}
.music .disc{flex:none;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,var(--white) 0 3px,var(--blue) 3.5px 6px,#1B2C55 6.5px);
  animation:spin 3.2s linear infinite;animation-play-state:paused}
.music.on .disc{animation-play-state:running}
.music .mt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.music .eq{display:flex;align-items:flex-end;gap:2px;height:12px;flex:none}
.music .eq i{width:2px;height:4px;border-radius:1px;background:var(--blue)}
.music.on .eq i{animation:eq .9s ease-in-out infinite}
.music.on .eq i:nth-child(2){animation-delay:.2s}.music.on .eq i:nth-child(3){animation-delay:.4s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

.hero-main{--yr:clamp(58px,17vw,104px);display:flex;align-items:stretch;justify-content:space-between;margin-top:14px}
.yr{font-family:var(--num);font-weight:700;font-size:var(--yr);line-height:.72;letter-spacing:-.03em;color:var(--ink)}
.yr em{font-style:normal;color:var(--blue)}
.hero-t{text-align:right;display:flex;flex-direction:column;justify-content:space-between}
.hero-t b{display:block;font-size:calc(var(--yr) * .335);letter-spacing:.12em;margin-right:-.12em;line-height:1;white-space:nowrap}
.hero-t span{font-size:13px;color:var(--ink3);letter-spacing:.1em}
.lede{margin-top:10px;margin-bottom:16px;font-size:18px;color:var(--ink2)}
.lede b{color:var(--blue);font-weight:700}

/* ================= 主体 ================= */
.main{display:flex;flex-direction:column}
.col-l{padding-top:8px}

/* ---------- 年轮：手机上铺满可用宽度，两侧留白 ---------- */
.dial-box{position:relative;width:90%;max-width:min(85vw,48dvh);aspect-ratio:1;margin:0 auto;container-type:inline-size}
#dial{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;cursor:grab;overflow:visible}
#dial:active{cursor:grabbing}
.dial-c{position:absolute;left:50%;top:50%;width:56%;height:56%;padding-top:3%;transform:translate(-50%,-50%);border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;touch-action:pan-y}
.c-m{font-size:15px;font-size:4.5cqw;font-weight:700;letter-spacing:.12em;color:var(--blue)}
.c-d{font-family:var(--num);font-weight:500;font-size:90px;font-size:25cqw;line-height:1;color:var(--ink);letter-spacing:-.02em}
.c-w{margin-top:2px;font-size:16px;font-size:4.8cqw;color:var(--ink3)}

.legend{display:flex;justify-content:center;gap:22px;margin-top:12px;font-size:15px;color:var(--ink2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:1px;margin-right:6px}

/* ---------- 日期长条 ---------- */
.strip-wrap{position:relative;margin-top:18px;background:var(--white);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.strip-wrap::before,.strip-wrap::after{content:"";position:absolute;top:0;bottom:0;width:36px;z-index:2;pointer-events:none}
.strip-wrap::before{left:0;background:linear-gradient(90deg,#fff,rgba(255,255,255,0))}
.strip-wrap::after{right:0;background:linear-gradient(-90deg,#fff,rgba(255,255,255,0))}
.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 calc(50% - var(--cw) / 2);-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.cell{position:relative;flex:0 0 var(--cw);scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;padding:11px 0 3px}
.cell .w{font-size:11px;color:var(--ink3);line-height:1}
.cell.we .w{color:var(--coral)}
.cell.fest .w{color:var(--coral);font-weight:700}
.cell .n{width:35px;height:35px;margin-top:5px;border-radius:12px;display:grid;place-items:center;font-family:var(--num);font-weight:500;font-size:20px;line-height:1;color:var(--ink2);transition:background .2s,color .2s}
.cell.ev .n{color:var(--ink);background:var(--blue-ll)}
.cell .dot{width:4px;height:4px;border-radius:50%;margin-top:4px;background:transparent}
.cell.ev .dot{background:var(--blue)}
.cell.on .n{background:var(--blue-soft);color:#fff;box-shadow:0 6px 12px -8px rgba(43,107,255,.45)}

/* ---------- 纪事导航 ---------- */
.evnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.evnav button{height:48px;padding:0 20px;border-radius:99px;background:var(--white);border:1px solid var(--line);font-size:17px;font-weight:700;color:var(--blue);white-space:nowrap;transition:.2s}
.evnav button:not(:disabled):active{background:var(--blue);color:#fff;border-color:var(--blue)}
.evnav button:disabled{color:var(--ink3);opacity:.5;cursor:default}
.evnav span{font-size:15px;color:var(--ink3);text-align:center}

/* ---------- 当日正文 ---------- */
.col-r{margin-top:26px;min-height:320px;background:var(--white);border:1px solid var(--line);border-radius:26px;padding:24px var(--pad) 8px;margin-left:calc(-1 * var(--pad) + 8px);margin-right:calc(-1 * var(--pad) + 8px)}
.sv-head{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.sv-head .big{font-family:var(--num);font-weight:700;font-size:58px;line-height:.9;color:var(--blue);letter-spacing:-.03em}
.sv-head .meta{font-size:16px;color:var(--ink3);line-height:1.6}
.sv-head .meta b{display:block;font-size:22px;color:var(--ink)}
.story{padding:12px 0 16px;border-bottom:1px solid var(--line);animation:fade .45s ease both}
.story::after{content:'';display:block;clear:both}
.story:last-child{border-bottom:0}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.story .tag{display:inline-block;padding:4px 13px;border-radius:99px;background:var(--blue-l);color:var(--blue2);font-size:15px;font-weight:700}
.story .tag.gold{background:#FFF2DC;color:#B66A00}
.story h3{font-size:27px;font-weight:700;line-height:1.45;margin:10px 0 8px}
.story p{font-size:17px;color:#2A3650;line-height:1.7;margin-top:.5em;text-align:justify}
.ph{display:grid;gap:4px;margin:12px 0 4px;border-radius:16px;overflow:hidden}
.ph.n2,.ph.n4{grid-template-columns:1fr 1fr}
.ph.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.ph.n3 figure:first-child{grid-row:span 2}
.ph figure{overflow:hidden;background:var(--blue-ll);cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:21/9}
.ph.n1 img{aspect-ratio:21/9}
.ph-v{float:left;width:38%;margin:0 20px 12px 0}
.ph-v figure{overflow:visible}
.ph-v img{aspect-ratio:3/4;height:auto;max-height:200px;object-fit:contain}
.story-v{display:flex;gap:20px;align-items:center}
.story-v .ph-v{flex:none;width:28%;margin:0}
.story-v-text{flex:1;min-width:0}
.story-v-text h3{margin-top:0}
.ph.n3 figure:first-child img{aspect-ratio:auto}
.void{padding:22px 0 16px}
.void .q{font-size:16px;color:var(--ink3);text-align:left;letter-spacing:.06em}
.void .near{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.void .near button{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--blue-ll);text-align:left;font-size:18px}
.void .near .d{font-family:var(--num);font-weight:700;font-size:19px;color:var(--blue);min-width:52px}
.void .near .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.void .near .a{font-size:13px;color:var(--ink3)}

/* ---------- 一览 ---------- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:52px 0 6px}
.sec-h h2{font-size:24px;font-weight:700}
.sec-h span{font-size:14px;color:var(--ink3)}
.ix{display:grid;grid-template-columns:1fr;column-gap:24px}
.ix-m{padding-top:18px}
.ix-h{display:flex;align-items:baseline;gap:8px;font-size:14px;color:var(--ink3);margin-bottom:6px}
.ix-h b{font-family:var(--num);font-weight:700;font-size:24px;color:var(--ink)}
.ix ul{list-style:none;background:var(--white);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ix li{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:14px 16px;cursor:pointer}
.ix li+li{border-top:1px solid var(--line)}
.ix li:active{background:var(--blue-ll)}
.ix .dd{font-family:var(--num);font-weight:700;font-size:20px;color:var(--blue)}
.ix .tt{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ix .tg{font-size:12px;color:var(--ink3)}

footer.wrap{margin-top:40px;padding:34px 0 calc(48px + env(safe-area-inset-bottom));text-align:center;border-top:1px solid var(--line)}
footer .y{font-family:var(--num);font-weight:700;font-size:52px;line-height:1;letter-spacing:-.03em}
footer .y em{font-style:normal;color:var(--blue)}
footer p{font-size:19px;color:var(--ink2);margin-top:12px;letter-spacing:.16em}
.wish-btn{display:inline-flex;align-items:center;gap:10px;margin-top:26px;height:56px;padding:0 30px;border-radius:99px;
  background:var(--blue-soft);color:#fff;font-size:18px;font-weight:700;letter-spacing:.12em;box-shadow:0 10px 22px -14px rgba(43,107,255,.5);transition:transform .15s}
.wish-btn:active{transform:scale(.96)}
.wish-btn svg{width:22px;height:22px}

/* ---------- 祝福弹层 + 烟花 ---------- */
.wish{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;
  background:rgba(245,248,255,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .4s}
.wish.on{opacity:1;pointer-events:auto}
.wish canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wish-in{position:relative;z-index:1;max-width:460px;width:100%}
.wish-k{display:inline-block;padding:6px 16px;border-radius:99px;background:var(--white);border:1px solid var(--line);font-size:15px;color:var(--ink2);letter-spacing:.12em}
.wish h3{margin-top:18px;font-size:56px;font-weight:700;letter-spacing:.14em;color:var(--blue);line-height:1.2;opacity:0}
.wish p{margin-top:16px;font-size:25px;font-weight:700;color:var(--ink);line-height:1.5;opacity:0}
.wish p.poem{margin-top:22px;padding:16px 6px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:26px;letter-spacing:.06em;color:var(--blue2);line-height:1.7}
.wish p.poem .pb{display:inline-block;text-align:left;margin-right:-.06em}
.wish p.poem .pb span{display:block}
.wish p.poem cite{display:block;margin-top:6px;font-size:15px;font-style:normal;font-weight:400;letter-spacing:.1em;color:var(--ink3)}
.wish.on h3{animation:up .6s .15s ease forwards}
.wish.on p{animation:up .6s ease forwards}
.wish-tip{margin-top:30px;font-size:15px;color:var(--ink3);opacity:0}
.wish.on .wish-tip{animation:up .6s 2.2s ease forwards}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- 吸顶迷你条（手机） ---------- */
.mini{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:20;display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:6px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 24px -14px rgba(15,27,51,.35);transform:translateY(-140%);transition:transform .3s}
.mini.on{transform:none}
.mini button.ar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;color:var(--blue);background:var(--blue-ll)}
.mini button.ar:disabled{opacity:.3}
.mini .md{flex:1;min-width:0;text-align:center;line-height:1.3}
.mini .md b{font-family:var(--num);font-weight:700;font-size:20px}
.mini .md span{display:block;font-size:13px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.lb{position:fixed;inset:0;z-index:30;background:rgba(245,248,255,.97);display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb.on{display:flex;animation:fade .25s}
.lb img{max-width:100%;max-height:100%;border-radius:12px}

/* ================= 平板 / 电脑 ================= */
@media (min-width:700px){
  :root{--pad:32px}
  .col-r{margin-left:0;margin-right:0;padding:28px 32px 10px}
  .ix{grid-template-columns:1fr 1fr}
}
@media (min-width:1000px){
  :root{--pad:40px}
  .main{display:grid;grid-template-columns:460px 1fr;column-gap:56px;align-items:stretch}
  .col-l{padding:20px 0 0}
  .col-r{margin-top:20px;min-height:0;contain:size;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin}
  .col-r > *{flex-shrink:0}
  .sv-head .big{font-size:76px}
  .story h3{font-size:28px}
  .ix{grid-template-columns:1fr 1fr 1fr}
  .mini{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="hero wrap">
  <div class="top">
    <span class="pill"><i></i>2026 · 年度纪事</span>
    <button class="music" id="music" aria-label="播放 / 暂停音乐"><span class="disc"></span><span class="mt" id="musicT"></span><span class="eq"><i></i><i></i><i></i></span></button>
  </div>
  <div class="hero-main">
    <h1 class="yr" aria-label="2026">20<em>26</em></h1>
    <div class="hero-t"><b>回望来路</b><b>启航新程</b></div>
  </div>
  <p class="lede">转动下面的<b>年轮</b>，一天一天看这一年发生了什么。</p>
</header>

<div class="wrap main">
  <section class="col-l">
    <div class="dial-box" id="dialBox">
      <svg id="dial" viewBox="0 0 400 400" aria-label="年轮：拖动外圈逐日浏览"></svg>
      <div class="dial-c" id="dialC">
        <div class="c-m" id="cM"></div>
        <div class="c-d" id="cD"></div>
        <div class="c-w" id="cW"></div>
      </div>
    </div>
    

    <div class="strip-wrap"><div class="strip" id="strip"></div></div>

    <div class="evnav">
      <button id="pv">‹ 上一则</button>
      <span id="navInfo"></span>
      <button id="nx">下一则 ›</button>
    </div>
  </section>

  <section class="col-r" id="story" aria-live="polite"></section>
</div>


<footer class="wrap">
  <div class="y">20<em>26</em></div>
  <p>新岁快乐 · 来日方长</p>
  <button class="wish-btn" id="wishBtn"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9z"/><path d="M19 14l.8 2.2 2.2.8-2.2.8L19 20l-.8-2.2-2.2-.8 2.2-.8z" opacity=".75"/></svg>点击收获祝福</button>
</footer>

<div class="mini" id="mini">
  <button class="ar" id="mpv" aria-label="上一则">‹</button>
  <button class="md" id="mtop"><b id="mDate"></b><span id="mSub"></span></button>
  <button class="ar" id="mnx" aria-label="下一则">›</button>
</div>
<div class="lb" id="lb"><img id="lbImg" alt=""></div>
<div class="wish" id="wish" role="dialog" aria-label="新岁祝福">
  <canvas id="fx"></canvas>
  <div class="wish-in"><span class="wish-k">2026 → 2027</span><div id="wishLines"></div><div class="wish-tip">轻点任意处关闭</div></div>
</div>

<script src="data.js"></script>
<script>
(() => {
'use strict';
const Y = 2026, N = 365, STEP = 360 / N, C = 200;
let CW = 58;
const EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const CN = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const NUM = ['〇','一','二','三','四','五','六','七','八','九'];
const WD = '日一二三四五六';
const FEST = {'2026-01-01':'元旦','2026-02-17':'春节','2026-03-03':'元宵','2026-04-05':'清明','2026-05-01':'劳动节','2026-06-19':'端午','2026-08-19':'七夕','2026-09-25':'中秋','2026-10-01':'国庆','2026-10-18':'重阳','2026-12-21':'冬至'};
const GOLD = '高光';

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const mod = (a, n) => ((a % n) + n) % n;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D0 = new Date(Y, 0, 1);
const dateOf = i => new Date(Y, 0, 1 + i);
const keyOf = i => { const d = dateOf(i); return `${Y}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const idxOf = k => { const [y, m, d] = k.split('-').map(Number); return Math.round((new Date(y, m - 1, d) - D0) / 864e5); };
const cnNum = d => d < 10 ? NUM[d] : d === 10 ? '十' : d < 20 ? '十' + NUM[d - 10] : NUM[Math.floor(d / 10)] + '十' + (d % 10 ? NUM[d % 10] : '');
const mStart = [...Array(12)].map((_, m) => Math.round((new Date(Y, m, 1) - D0) / 864e5));
const mLen = m => new Date(Y, m + 1, 0).getDate();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 数据 ---------- */
const byIdx = {};
(window.EVENTS || []).filter(e => e && /^2026-\d\d-\d\d$/.test(e.date))
  .sort((a, b) => a.date.localeCompare(b.date))
  .forEach(e => (byIdx[idxOf(e.date)] ||= []).push(e));

/* ---------- 状态 ---------- */

/* ================= 年轮 ================= */
const NS = 'http://www.w3.org/2000/svg';

(function buildDial() {

let hlM = -1;

    const [x, y] = P(128, (mStart[m] + mLen(m) / 2) * STEP + rot);
    t.setAttribute('x', x.toFixed(1)); t.setAttribute('y', y.toFixed(1));

function setRot(r, src) {

// 磁吸：松手时若附近 3 天内有纪事，自动吸附过去

/* ---------- 拖动 + 惯性 ---------- */
(function drag() {

const cells = strip.children;

function onSel(src, prev) {

/* ================= 当日正文 ================= */
function renderStory() {

    <div class="meta"><b>${m + 1}月${d.getDate()}日 · 星期${WD[d.getDay()]}</b>2026 年第 ${sel + 1} 天${FEST[k] ? ' · ' + FEST[k] : ''}</div></div>`;

/* ================= 送祝福：烟花 + 祝福语 ================= */
(function wish() {
